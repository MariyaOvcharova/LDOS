<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IT Excuse Generator</title>
</head>
<body>
  <h1>IT Excuse Generator</h1>
  <p>Server is down? Get a reason for your boss.</p>
  <button onclick="getExcuse()">Generate Excuse</button>
  <p id="excuse"></p>
  <script>
    function getExcuse() {
      fetch('/api/excuse')
        .then(function (r) { return r.text(); })
        .then(function (t) { document.getElementById('excuse').innerText = t; });
    }
  </script>
</body>
</html>
